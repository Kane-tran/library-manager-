<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ==================== HEAD ==================== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' - Library Management'">Library Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<!-- ==================== NAVBAR ==================== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-book-fill me-1"></i> LibraryMS
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/books}"><i class="bi bi-journal-bookmark me-1"></i>Books</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/borrow}"><i class="bi bi-arrow-left-right me-1"></i>My Borrows</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/reservations}"><i class="bi bi-bookmark me-1"></i>Reservations</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/fines}"><i class="bi bi-cash me-1"></i>Fines</a>
                </li>
                <!-- Librarian/Manager only -->
                <li class="nav-item dropdown" sec:authorize="hasAnyRole('LIBRARIAN','MANAGER')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-tools me-1"></i>Manage
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/borrow/all}"><i class="bi bi-list-check me-1"></i>All Borrows</a></li>
                        <li><a class="dropdown-item" th:href="@{/borrow/issue}"><i class="bi bi-plus-circle me-1"></i>Issue Book</a></li>
                        <li><a class="dropdown-item" th:href="@{/reservations/all}"><i class="bi bi-bookmark-star me-1"></i>All Reservations</a></li>
                        <li><a class="dropdown-item" th:href="@{/fines/all}"><i class="bi bi-currency-dollar me-1"></i>All Fines</a></li>
                        <li><hr class="dropdown-divider"/></li>
                        <li><a class="dropdown-item" th:href="@{/books/categories}"><i class="bi bi-tags me-1"></i>Categories</a></li>
                        <li><a class="dropdown-item" th:href="@{/books/authors}"><i class="bi bi-person-lines-fill me-1"></i>Authors</a></li>
                        <li><a class="dropdown-item" th:href="@{/books/import}"><i class="bi bi-upload me-1"></i>Import Books</a></li>
                        <li sec:authorize="hasRole('MANAGER')"><hr class="dropdown-divider"/></li>
                        <li sec:authorize="hasRole('MANAGER')">
                            <a class="dropdown-item" th:href="@{/admin/users}"><i class="bi bi-people me-1"></i>Users</a>
                        </li>
                        <li sec:authorize="hasRole('MANAGER')">
                            <a class="dropdown-item" th:href="@{/admin/reports}"><i class="bi bi-bar-chart me-1"></i>Reports</a>
                        </li>
                    </ul>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-1"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"/></li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ==================== ALERTS ==================== -->
<div th:fragment="alerts" class="container mt-2">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ==================== SCRIPTS ==================== -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</div>

<!-- ==================== PAGINATION ==================== -->
<nav th:fragment="pagination(page, baseUrl)" aria-label="Pagination">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="${baseUrl + '?page=' + (page.number - 1)}">Previous</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="${baseUrl + '?page=' + i}" th:text="${i + 1}"></a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="${baseUrl + '?page=' + (page.number + 1)}">Next</a>
        </li>
    </ul>
</nav>

</html>
