<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Book Detail')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/books}">Books</a></li>
            <li class="breadcrumb-item active" th:text="${book.title}"></li>
        </ol>
    </nav>

    <!-- ===== BOOK INFO ===== -->
    <div class="row g-4 mb-5">
        <!-- Cover -->
        <div class="col-md-3 text-center">
            <div class="bg-light rounded p-3 d-flex align-items-center justify-content-center shadow-sm" style="min-height:260px;">
                <img th:if="${book.coverImageUrl != null}" th:src="${book.coverImageUrl}"
                     class="img-fluid rounded shadow" style="max-height:250px; object-fit:cover;" alt="cover"/>
                <i th:unless="${book.coverImageUrl != null}" class="bi bi-book text-secondary" style="font-size:6rem;"></i>
            </div>
            <!-- Rating summary bên dưới ảnh -->
            <div class="mt-3" th:if="${reviewCount > 0}">
                <div class="d-flex justify-content-center gap-1 fs-5" id="avgStarsDisplay">
                    <span th:each="i : ${#numbers.sequence(1, 5)}">
                        <i class="bi" th:classappend="${i <= avgRating} ? 'bi-star-fill text-warning' : 'bi-star text-muted'"></i>
                    </span>
                </div>
                <div class="text-muted small mt-1">
                    <strong th:text="${#numbers.formatDecimal(avgRating,1,1)}"></strong>/5
                    (<span th:text="${reviewCount}"></span> reviews)
                </div>
            </div>
            <div class="mt-2 text-muted small" th:unless="${reviewCount > 0}">No reviews yet</div>
        </div>

        <!-- Info -->
        <div class="col-md-5">
            <h2 class="fw-bold" th:text="${book.title}">Title</h2>
            <p class="text-muted mb-2 fs-5">
                <i class="bi bi-person me-1"></i>
                <span th:text="${book.authors != null and !book.authors.empty}
                               ? ${#strings.listJoin(book.authors.![name], ', ')} : 'Unknown'"></span>
            </p>
            <span th:if="${book.category != null}" class="badge bg-secondary mb-3 fs-6"
                  th:text="${book.category.name}"></span>

            <table class="table table-sm table-borderless w-auto">
                <tr th:if="${book.isbn != null}">
                    <th class="text-muted pe-3">ISBN</th><td th:text="${book.isbn}"></td>
                </tr>
                <tr th:if="${book.publisher != null}">
                    <th class="text-muted pe-3">Publisher</th><td th:text="${book.publisher}"></td>
                </tr>
                <tr th:if="${book.publishedYear != null}">
                    <th class="text-muted pe-3">Year</th><td th:text="${book.publishedYear}"></td>
                </tr>
                <tr>
                    <th class="text-muted pe-3">Language</th><td th:text="${book.language}"></td>
                </tr>
                <tr>
                    <th class="text-muted pe-3">Copies</th>
                    <td th:text="${book.availableCopies} + ' available / ' + ${book.totalCopies} + ' total'"></td>
                </tr>
            </table>
            <p th:if="${book.description != null}" th:text="${book.description}" class="mt-2 text-muted"></p>
        </div>

        <!-- Actions -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Availability</h6>
                    <div th:if="${book.available}" class="alert alert-success py-2 mb-3">
                        <i class="bi bi-check-circle me-1"></i>
                        <strong th:text="${book.availableCopies}"></strong> copies available
                    </div>
                    <div th:unless="${book.available}" class="alert alert-warning py-2 mb-3">
                        <i class="bi bi-clock me-1"></i>Currently unavailable
                    </div>

                    <div sec:authorize="hasAnyRole('STUDENT','LECTURER')">
                        <form th:if="${book.available}"
                              th:action="@{/borrow/borrow/{id}(id=${book.id})}" method="post">
                            <button type="submit" class="btn btn-primary w-100 mb-2"
                                    onclick="return confirm('Borrow this book?')">
                                <i class="bi bi-arrow-down-circle me-1"></i>Borrow Now
                            </button>
                        </form>
                        <form th:unless="${book.available}"
                              th:action="@{/reservations/reserve/{id}(id=${book.id})}" method="post">
                            <button type="submit" class="btn btn-outline-warning w-100 mb-2">
                                <i class="bi bi-bookmark-plus me-1"></i>Reserve
                            </button>
                        </form>
                    </div>

                    <div sec:authorize="hasAnyRole('LIBRARIAN','MANAGER')">
                        <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-outline-warning w-100 mb-2">
                            <i class="bi bi-pencil me-1"></i>Edit Book
                        </a>
                        <a th:href="@{/borrow/issue(bookId=${book.id})}" class="btn btn-primary w-100 mb-2">
                            <i class="bi bi-person-plus me-1"></i>Issue to Member
                        </a>
                        <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post"
                              onsubmit="return confirm('Delete this book?')">
                            <button type="submit" class="btn btn-outline-danger w-100">
                                <i class="bi bi-trash me-1"></i>Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== REVIEWS SECTION ===== -->
    <div class="row">
        <div class="col-lg-8">
            <h4 class="mb-4 fw-bold">
                <i class="bi bi-star-fill text-warning me-2"></i>Reviews
                <span class="badge bg-secondary ms-2" th:text="${reviewCount}"></span>
            </h4>

            <!-- Rating distribution (nếu có review) -->
            <div class="card shadow-sm mb-4" th:if="${reviewCount > 0}">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-3 text-center">
                            <div class="display-4 fw-bold text-warning"
                                 th:text="${#numbers.formatDecimal(avgRating,1,1)}"></div>
                            <div class="d-flex justify-content-center gap-1 mb-1">
                                <span th:each="i : ${#numbers.sequence(1,5)}">
                                    <i class="bi" th:classappend="${i <= avgRating}?'bi-star-fill text-warning':'bi-star text-muted'"></i>
                                </span>
                            </div>
                            <small class="text-muted" th:text="${reviewCount} + ' reviews'"></small>
                        </div>
                        <div class="col-9">
                            <!-- Rating bars 5→1 -->
                            <div th:each="star : ${#numbers.sequence(5,1,-1)}" class="d-flex align-items-center gap-2 mb-1">
                                <small class="text-muted" style="width:20px;" th:text="${star}"></small>
                                <i class="bi bi-star-fill text-warning small"></i>
                                <div class="progress flex-grow-1" style="height:8px;">
                                    <div class="progress-bar bg-warning"
                                         th:style="'width:' + ${reviewCount > 0 ? (reviews.?[rating == star].size() * 100 / reviewCount) : 0} + '%'"></div>
                                </div>
                                <small class="text-muted" style="width:20px;"
                                       th:text="${reviews.?[rating == star].size()}"></small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form thêm review -->
            <div class="card shadow-sm mb-4" th:unless="${hasReviewed}">
                <div class="card-header fw-semibold">
                    <i class="bi bi-pencil-square me-1"></i>Write a Review
                </div>
                <div class="card-body">
                    <form th:action="@{/reviews/add}" method="post">
                        <input type="hidden" name="bookId" th:value="${book.id}"/>
                        <!-- Star rating -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Your Rating *</label>
                            <div class="star-rating d-flex gap-2 fs-2" id="starRating">
                                <span th:each="i : ${#numbers.sequence(1,5)}"
                                      class="star-btn text-muted"
                                      th:attr="data-value=${i}"
                                      style="cursor:pointer;">&#9733;</span>
                            </div>
                            <input type="hidden" name="rating" id="ratingInput" value="0" required/>
                            <small class="text-muted" id="ratingLabel">Click to rate</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Your Comment *</label>
                            <textarea name="comment" class="form-control" rows="3"
                                      placeholder="Share your thoughts about this book..."
                                      required minlength="10" maxlength="1000"></textarea>
                        </div>
                        <button type="submit" class="btn btn-warning fw-semibold">
                            <i class="bi bi-send me-1"></i>Submit Review
                        </button>
                    </form>
                </div>
            </div>

            <!-- Form sửa review (nếu đã review rồi) -->
            <div class="card shadow-sm border-warning mb-4" th:if="${hasReviewed and userReview != null}">
                <div class="card-header bg-warning bg-opacity-10 fw-semibold">
                    <i class="bi bi-pencil me-1"></i>Edit Your Review
                </div>
                <div class="card-body">
                    <form th:action="@{/reviews/{id}/update(id=${userReview.id})}" method="post">
                        <input type="hidden" name="bookId" th:value="${book.id}"/>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Your Rating *</label>
                            <div class="star-rating d-flex gap-2 fs-2" id="editStarRating">
                                <span th:each="i : ${#numbers.sequence(1,5)}"
                                      class="star-btn"
                                      th:classappend="${i <= userReview.rating} ? 'text-warning' : 'text-muted'"
                                      th:attr="data-value=${i}"
                                      style="cursor:pointer;">&#9733;</span>
                            </div>
                            <input type="hidden" name="rating" id="editRatingInput"
                                   th:value="${userReview.rating}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Your Comment *</label>
                            <textarea name="comment" class="form-control" rows="3"
                                      th:text="${userReview.comment}"
                                      required minlength="10" maxlength="1000"></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-save me-1"></i>Update Review
                            </button>
                            <form th:action="@{/reviews/{id}/delete(id=${userReview.id})}" method="post">
                                <input type="hidden" name="bookId" th:value="${book.id}"/>
                                <button type="submit" class="btn btn-outline-danger"
                                        onclick="return confirm('Delete your review?')">
                                    <i class="bi bi-trash me-1"></i>Delete
                                </button>
                            </form>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Danh sách reviews -->
            <div th:if="${reviews.empty}" class="text-center py-4 text-muted">
                <i class="bi bi-chat-square fs-2"></i>
                <p class="mt-2">No reviews yet. Be the first to review!</p>
            </div>

            <div th:each="review : ${reviews}" class="card shadow-sm mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold"
                                 style="width:40px;height:40px;font-size:1.1rem;"
                                 th:text="${review.user.fullName.substring(0,1).toUpperCase()}"></div>
                            <div>
                                <div class="fw-semibold" th:text="${review.user.fullName}"></div>
                                <small class="text-muted" th:text="${review.user.role}"></small>
                            </div>
                        </div>
                        <div class="text-end">
                            <!-- Stars -->
                            <div class="d-flex gap-1">
                                <span th:each="i : ${#numbers.sequence(1,5)}">
                                    <i class="bi small"
                                       th:classappend="${i <= review.rating} ? 'bi-star-fill text-warning' : 'bi-star text-muted'"></i>
                                </span>
                            </div>
                            <small class="text-muted"
                                   th:text="${#temporals.format(review.createdAt,'dd/MM/yyyy')}"></small>
                        </div>
                    </div>
                    <p class="mb-2" th:text="${review.comment}"></p>
                    <!-- Delete (librarian/manager) -->
                    <form th:if="${currentUser.role.name() == 'LIBRARIAN' or currentUser.role.name() == 'MANAGER'}"
                          th:action="@{/reviews/{id}/delete(id=${review.id})}" method="post"
                          class="d-inline">
                        <input type="hidden" name="bookId" th:value="${book.id}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Delete this review?')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
// Star rating widget
function setupStars(containerId, inputId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const stars = container.querySelectorAll('.star-btn');
    const input = document.getElementById(inputId);
    const labels = ['','Poor','Fair','Good','Very Good','Excellent'];

    stars.forEach(star => {
        star.addEventListener('mouseover', () => {
            const val = parseInt(star.dataset.value);
            stars.forEach((s, i) => {
                s.style.color = i < val ? '#ffc107' : '#aaa';
            });
        });
        star.addEventListener('mouseout', () => {
            const cur = parseInt(input.value);
            stars.forEach((s, i) => {
                s.style.color = i < cur ? '#ffc107' : '#aaa';
            });
        });
        star.addEventListener('click', () => {
            const val = parseInt(star.dataset.value);
            input.value = val;
            stars.forEach((s, i) => {
                s.style.color = i < val ? '#ffc107' : '#aaa';
            });
            const labelEl = document.getElementById('ratingLabel');
            if (labelEl) labelEl.textContent = labels[val] + ' (' + val + '/5)';
        });
    });
}
setupStars('starRating', 'ratingInput');
setupStars('editStarRating', 'editRatingInput');
</script>
</body>
</html>
