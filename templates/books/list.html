<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Books')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-journal-bookmark me-2"></i>Books</h2>
        <div sec:authorize="hasAnyRole('LIBRARIAN','MANAGER')">
            <a th:href="@{/books/new}" class="btn btn-primary me-2">
                <i class="bi bi-plus-circle me-1"></i>Add Book
            </a>
            <a th:href="@{/books/import}" class="btn btn-outline-secondary">
                <i class="bi bi-upload me-1"></i>Import CSV
            </a>
        </div>
    </div>

    <!-- Search & Filter -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/books}" method="get" class="row g-2 align-items-end">
                <div class="col-md-5">
                    <label class="form-label">Search by title, ISBN, author</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Search books..."/>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Category</label>
                    <select name="categoryId" class="form-select">
                        <option value="0">All Categories</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${cat.id == selectedCategory}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-funnel me-1"></i>Filter
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Results -->
    <div th:if="${books.empty}" class="text-center py-5 text-muted">
        <i class="bi bi-book fs-1"></i>
        <p class="mt-2">No books found.</p>
    </div>

    <div class="row g-4" th:unless="${books.empty}">
        <div class="col-sm-6 col-md-4 col-lg-3" th:each="book : ${books.content}">
            <div class="card h-100 shadow-sm book-card">
                <div class="card-img-top bg-light d-flex align-items-center justify-content-center"
                     style="height:160px; overflow:hidden;">
                    <img th:if="${book.coverImageUrl != null}" th:src="${book.coverImageUrl}"
                         class="img-fluid" style="max-height:160px; object-fit:cover;" alt="cover"/>
                    <i th:unless="${book.coverImageUrl != null}" class="bi bi-book text-secondary" style="font-size:4rem;"></i>
                </div>
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title mb-1" th:text="${book.title}">Title</h6>
                    <small class="text-muted mb-1"
                           th:text="${book.authors != null and !book.authors.empty} ? ${#strings.listJoin(book.authors.![name], ', ')} : 'Unknown Author'"></small>
                    <span th:if="${book.category != null}" class="badge bg-secondary mb-2"
                          th:text="${book.category.name}"></span>
                    <div class="mt-auto">
                        <span th:if="${book.available}" class="badge bg-success">
                            <i class="bi bi-check-circle me-1"></i>Available (<span th:text="${book.availableCopies}"></span>)
                        </span>
                        <span th:unless="${book.available}" class="badge bg-danger">
                            <i class="bi bi-x-circle me-1"></i>Not Available
                        </span>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-sm btn-outline-primary w-100">
                        <i class="bi bi-eye me-1"></i>View Details
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="mt-4" th:if="${books.totalPages > 1}">
        <nav>
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${books.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/books(q=${q},categoryId=${selectedCategory},page=${books.number - 1})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, books.totalPages - 1)}"
                    th:classappend="${i == books.number} ? 'active'">
                    <a class="page-link" th:href="@{/books(q=${q},categoryId=${selectedCategory},page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${books.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/books(q=${q},categoryId=${selectedCategory},page=${books.number + 1})}">Next</a>
                </li>
            </ul>
        </nav>
        <p class="text-center text-muted small"
           th:text="'Showing ' + ${books.numberOfElements} + ' of ' + ${books.totalElements} + ' books'"></p>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
