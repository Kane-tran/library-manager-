<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<div class="container py-4" style="max-width:800px;">
    <h2 class="mb-4"><i class="bi bi-tags me-2"></i>Categories</h2>
    <div class="row g-4">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header"><h6 class="mb-0">Add / Edit Category</h6></div>
                <div class="card-body">
                    <form th:action="@{/books/categories/save}" method="post" th:object="${category}">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="mb-3">
                            <label class="form-label">Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-save me-1"></i>Save
                        </button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header"><h6 class="mb-0">All Categories</h6></div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr><th>Name</th><th>Description</th><th></th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td th:text="${cat.name}" class="fw-semibold"></td>
                                <td class="text-muted small" th:text="${cat.description}"></td>
                                <td>
                                    <form th:action="@{/books/categories/{id}/delete(id=${cat.id})}" method="post"
                                          onsubmit="return confirm('Delete category?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${categories.empty}">
                                <td colspan="3" class="text-center text-muted">No categories yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
