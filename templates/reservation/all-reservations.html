<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All Reservations')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<div class="container-fluid py-4">
    <h2 class="mb-4"><i class="bi bi-bookmark-star me-2"></i>All Reservations</h2>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr><th>#</th><th>Member</th><th>Book</th><th>Reserved On</th><th>Queue</th><th>Status</th><th>Expires</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${reservations.content}">
                        <td class="text-muted small" th:text="${r.id}"></td>
                        <td>
                            <div class="fw-semibold" th:text="${r.user.fullName}"></div>
                            <small class="text-muted" th:text="${r.user.username}"></small>
                        </td>
                        <td th:text="${r.book.title}"></td>
                        <td th:text="${#temporals.format(r.reservationDate,'dd/MM/yyyy')}"></td>
                        <td>
                            <span th:if="${r.status.name() == 'PENDING'}" class="badge bg-info text-dark"
                                  th:text="'#' + ${r.queuePosition}"></span>
                            <span th:unless="${r.status.name() == 'PENDING'}">-</span>
                        </td>
                        <td>
                            <span th:switch="${r.status.name()}">
                                <span th:case="'PENDING'" class="badge bg-warning text-dark">Pending</span>
                                <span th:case="'READY'" class="badge bg-success">Ready</span>
                                <span th:case="'CANCELLED'" class="badge bg-secondary">Cancelled</span>
                                <span th:case="'FULFILLED'" class="badge bg-primary">Fulfilled</span>
                                <span th:case="'EXPIRED'" class="badge bg-danger">Expired</span>
                            </span>
                        </td>
                        <td th:text="${r.expiryDate != null ? #temporals.format(r.expiryDate,'dd/MM/yyyy') : '-'}"></td>
                        <td>
                            <form th:if="${r.status.name() == 'PENDING' or r.status.name() == 'READY'}"
                                  th:action="@{/reservations/{id}/cancel(id=${r.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Cancel reservation?')">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${reservations.empty}">
                        <td colspan="8" class="text-center text-muted py-4">No reservations found</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="mt-4" th:if="${reservations.totalPages > 1}">
        <nav><ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${reservations.first}?'disabled'">
                <a class="page-link" th:href="@{/reservations/all(page=${reservations.number-1})}">Previous</a>
            </li>
            <li th:each="i:${#numbers.sequence(0,reservations.totalPages-1)}" class="page-item"
                th:classappend="${i==reservations.number}?'active'">
                <a class="page-link" th:href="@{/reservations/all(page=${i})}" th:text="${i+1}"></a>
            </li>
            <li class="page-item" th:classappend="${reservations.last}?'disabled'">
                <a class="page-link" th:href="@{/reservations/all(page=${reservations.number+1})}">Next</a>
            </li>
        </ul></nav>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
