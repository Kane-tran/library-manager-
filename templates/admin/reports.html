<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reports')}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<div class="container-fluid py-4">
    <h2 class="mb-4"><i class="bi bi-bar-chart me-2"></i>Reports &amp; Analytics</h2>

    <!-- Summary Cards -->
    <div class="row g-4 mb-5">
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm bg-primary text-white">
                <div class="card-body text-center">
                    <div class="fs-2 fw-bold" th:text="${totalBooks}">0</div>
                    <div><i class="bi bi-book me-1"></i>Total Books</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm bg-info text-white">
                <div class="card-body text-center">
                    <div class="fs-2 fw-bold" th:text="${totalUsers}">0</div>
                    <div><i class="bi bi-people me-1"></i>Total Users</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm bg-warning text-white">
                <div class="card-body text-center">
                    <div class="fs-2 fw-bold" th:text="${activeBorrows}">0</div>
                    <div><i class="bi bi-arrow-left-right me-1"></i>Active Borrows</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm bg-danger text-white">
                <div class="card-body text-center">
                    <div class="fs-2 fw-bold" th:text="${overdueCount}">0</div>
                    <div><i class="bi bi-exclamation-triangle me-1"></i>Overdue</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Users by Role Chart -->
        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-header"><h6 class="mb-0">Users by Role</h6></div>
                <div class="card-body d-flex justify-content-center align-items-center">
                    <canvas id="roleChart" style="max-height:300px;"></canvas>
                </div>
            </div>
        </div>

        <!-- Fine Summary -->
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-header"><h6 class="mb-0">Fine Summary</h6></div>
                <div class="card-body">
                    <canvas id="fineChart" style="max-height:300px;"></canvas>
                    <div class="mt-3">
                        <div class="d-flex justify-content-between py-2 border-bottom">
                            <span class="text-muted">Total Fines Issued</span>
                            <strong th:text="${#numbers.formatDecimal(totalFines,0,'COMMA',0,'POINT')} + ' ₫'"></strong>
                        </div>
                        <div class="d-flex justify-content-between py-2 border-bottom">
                            <span class="text-muted">Collected</span>
                            <strong class="text-success" th:text="${#numbers.formatDecimal(collectedFines,0,'COMMA',0,'POINT')} + ' ₫'"></strong>
                        </div>
                        <div class="d-flex justify-content-between py-2">
                            <span class="text-muted">Outstanding</span>
                            <strong class="text-danger"
                                    th:text="${#numbers.formatDecimal(totalFines.subtract(collectedFines),0,'COMMA',0,'POINT')} + ' ₫'"></strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Stats -->
        <div class="col-md-3">
            <div class="card shadow-sm h-100">
                <div class="card-header"><h6 class="mb-0">Quick Links</h6></div>
                <div class="card-body d-flex flex-column gap-2">
                    <a th:href="@{/borrow/all(status=OVERDUE)}" class="btn btn-outline-danger">
                        <i class="bi bi-exclamation-triangle me-1"></i>View Overdue (<span th:text="${overdueCount}"></span>)
                    </a>
                    <a th:href="@{/fines/all}" class="btn btn-outline-warning">
                        <i class="bi bi-cash me-1"></i>Pending Fines (<span th:text="${pendingFines}"></span>)
                    </a>
                    <a th:href="@{/reservations/all}" class="btn btn-outline-info">
                        <i class="bi bi-bookmark me-1"></i>All Reservations
                    </a>
                    <a th:href="@{/books/import}" class="btn btn-outline-secondary">
                        <i class="bi bi-upload me-1"></i>Import Books
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart data passed via hidden fields -->
<div id="chartData"
     th:attr="data-roles=${#strings.toString(usersByRole.keySet())},
              data-counts=${#strings.toString(usersByRole.values())},
              data-collected=${collectedFines},
              data-outstanding=${totalFines.subtract(collectedFines)}"
     style="display:none;"></div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
(function() {
    const el = document.getElementById('chartData');
    const roles = el.dataset.roles.replace(/[\[\]]/g,'').split(', ');
    const counts = el.dataset.counts.replace(/[\[\]]/g,'').split(', ').map(Number);

    new Chart(document.getElementById('roleChart'), {
        type: 'doughnut',
        data: {
            labels: roles,
            datasets: [{
                data: counts,
                backgroundColor: ['#0dcaf0','#0d6efd','#ffc107','#dc3545']
            }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
    });

    new Chart(document.getElementById('fineChart'), {
        type: 'bar',
        data: {
            labels: ['Fines'],
            datasets: [
                { label: 'Collected', data: [parseFloat(el.dataset.collected)], backgroundColor: '#198754' },
                { label: 'Outstanding', data: [parseFloat(el.dataset.outstanding)], backgroundColor: '#dc3545' }
            ]
        },
        options: {
            responsive: true,
            plugins: { legend: { position: 'bottom' } },
            scales: { x: { stacked: true }, y: { stacked: true } }
        }
    });
})();
</script>
</body>
</html>
