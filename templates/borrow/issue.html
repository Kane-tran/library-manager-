<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Issue Book')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<div class="container py-4" style="max-width:560px;">
    <h2 class="mb-4"><i class="bi bi-person-plus me-2"></i>Issue Book to Member</h2>
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/borrow/issue}" method="post">
                <div class="mb-3">
                    <label class="form-label">User ID *</label>
                    <input type="number" name="userId" class="form-control" placeholder="Enter member user ID" required/>
                    <div class="form-text">Find user ID from <a th:href="@{/admin/users}">Users list</a></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Book ID *</label>
                    <input type="number" name="bookId" th:value="${bookId}" class="form-control"
                           placeholder="Enter book ID" required/>
                    <div class="form-text">Find book ID from <a th:href="@{/books}">Books list</a></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check2-circle me-1"></i>Issue Book
                    </button>
                    <a th:href="@{/borrow/all}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
